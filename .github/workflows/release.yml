name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and publish
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore Loadout.sln

      - name: Test
        run: dotnet test Loadout.sln --configuration Release --no-restore

      - name: Publish Windows x64
        run: >-
          dotnet publish src/Loadout.App/Loadout.App.csproj
          --configuration Release
          --runtime win-x64
          --self-contained false
          --output artifacts/loadout-win-x64

      - name: Package and checksum
        shell: pwsh
        run: |
          Compress-Archive -Path artifacts/loadout-win-x64/* -DestinationPath artifacts/loadout-win-x64.zip
          $hash = (Get-FileHash artifacts/loadout-win-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  loadout-win-x64.zip" | Set-Content artifacts/loadout-win-x64.zip.sha256

      - name: Publish GitHub release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(
            "artifacts/loadout-win-x64.zip",
            "artifacts/loadout-win-x64.zip.sha256"
          )

          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG @assets --clobber
          }
          else {
            gh release create $env:RELEASE_TAG @assets --generate-notes --verify-tag
          }
